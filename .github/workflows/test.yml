name: CI

permissions: {}

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-foundry:
    name: Foundry Quality & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check Formatting
        run: forge fmt --check

      - name: Build & Check Sizes
        run: forge build --sizes

      - name: Run Unit Tests
        run: forge test -vvv

  test-arc:
    name: Arc Foundry Runtime Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Arc Foundry
        run: |
          mkdir -p "$HOME/.local/bin"
          ARC_FOUNDRY_VERSION="v0.8.0-2"
          ARC_URL="https://github.com/circlefin/arc-foundry/releases/download/${ARC_FOUNDRY_VERSION}/arc-foundry-${ARC_FOUNDRY_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading Arc Foundry from ${ARC_URL}..."
          curl -sSL "${ARC_URL}" | tar -xz -C /tmp
          mv /tmp/forge "$HOME/.local/bin/arc-forge"
          mv /tmp/cast "$HOME/.local/bin/arc-cast"
          mv /tmp/anvil "$HOME/.local/bin/arc-anvil"
          chmod +x "$HOME/.local/bin/arc-"*
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Show Arc Forge version
        run: arc-forge --version

      - name: Run Tests on Arc Network
        run: arc-forge test --network arc -vvv

  auto-pr-merge:
    name: Auto PR and Merge
    needs: [test-foundry, test-arc]
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF_NAME}"

          echo "Target repository: $REPO"
          echo "Source branch:     $BRANCH"

          # Check if an open PR already exists for this branch against main
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            COMMIT_TITLE=$(git log -1 --pretty=%s)
            PR_TITLE="${COMMIT_TITLE:-Auto PR: $BRANCH}"
            echo "Opening PR from $BRANCH into main: $PR_TITLE"
            PR_URL=$(gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "Automated PR created by GitHub Actions after all CI checks passed on branch \`$BRANCH\`.")
            echo "Created PR: $PR_URL"
            PR_NUMBER=$(gh pr view "$BRANCH" --repo "$REPO" --json number --jq '.number')
          else
            echo "Found existing open PR #$PR_NUMBER for branch $BRANCH"
          fi

          echo "Merging PR #$PR_NUMBER..."
          if ! gh pr merge "$PR_NUMBER" --repo "$REPO" --merge; then
            echo "Direct merge not permitted or pending status checks; enabling auto-merge..."
            gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --merge
          fi
